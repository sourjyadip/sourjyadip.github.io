{%- comment -%} include.home = true on the homepage so in-page anchors don't reload {%- endcomment -%}
{%- if include.home -%}{%- assign root = '' -%}{%- else -%}{%- assign root = '/' | relative_url -%}{%- endif -%}
  <nav class="topnav" aria-label="Site">
    <div class="topnav__inner">
      <a class="topnav__name" href="{% if include.home %}#top{% else %}{{ '/' | relative_url }}{% endif %}">{{ site.author.name }}</a>
      <div class="topnav__links">
        <a href="{{ root }}#about">About</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/thesis/' | relative_url }}"{% if page.url == '/thesis/' %} aria-current="page"{% endif %}>Thesis</a>
        <a href="{{ root }}#publications">Publications</a>
        <a href="{{ root }}#experience">Experience</a>
        <a href="{{ '/files/PhD_CV_Sourjyadip_Ray.pdf' | relative_url }}">CV</a>
      </div>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      </button>
    </div>
  </nav>
